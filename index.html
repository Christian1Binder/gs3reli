let s={};const app=document.getElementById("app");function progress(){try{return JSON.parse(localStorage.getItem("reli3-progress")||"{}")}catch{return {}}}function mark(id){let p=progress();p[id]=true;try{localStorage.setItem("reli3-progress",JSON.stringify(p))}catch{}}function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function home(){s={mode:"home"};let p=progress();app.innerHTML='<section class="hero"><h2>Hallo, Lernprofi! 👋</h2><p>Entdecke drei Feste, lerne das Vaterunser und übe mit Spielen.</p><span class="pill">⭐ '+Object.keys(p).length+' von 10 Bereichen geschafft</span></section><div class="grid">'+lessons.map((l,i)=>'<button class="tile" onclick="startLesson('+i+')"><span class="art">'+l.icon+'</span><strong>'+l.name+(p[l.id]?" ✅":"")+'</strong><span>'+l.date+' · 5 Lernkarten</span></button>').join("")+'<button class="tile" onclick="startMatch()"><span class="art">🧩</span><strong>Zuordnung '+(p.match?"✅":"")+'</strong><span>10 passende Paare finden</span></button><button class="tile" onclick="startOrder()"><span class="art">🔢</span><strong>Reihenfolge '+(p.order?"✅":"")+'</strong><span>Martins Geschichte ordnen</span></button><button class="tile" onclick="prayerHome()"><span class="art">🙏</span><strong>Vaterunser lernen '+(p.prayer?"✅":"")+'</strong><span>Lesen, hören und 7 Lernspiele</span></button><button class="tile" onclick="startStory()"><span class="art">🖼️</span><strong>Martins Bildergeschichte '+(p.story?"✅":"")+'</strong><span>6 Szenen in die richtige Reihenfolge bringen</span></button><button class="tile" onclick="startChallenge()"><span class="art">🎯</span><strong>Wahr oder Quatsch? '+(p.challenge?"✅":"")+'</strong><span>8 Aussagen beurteilen</span></button><button class="tile" onclick="startMystery()"><span class="art">🕵️</span><strong>Wer bin ich? '+(p.mystery?"✅":"")+'</strong><span>5 spannende Rätsel lösen</span></button><button class="tile" onclick="startQuiz()"><span class="art">🏆</span><strong>Quiz '+(p.quiz?"✅":"")+'</strong><span>15 Fragen beantworten</span></button></div><p class="muted small">Keine Anmeldung · Fortschritt nur auf diesem Gerät</p>'}

function startChallenge(){s={mode:"challenge",list:shuffle(claims).slice(0,8),n:0,score:0,answered:false};renderChallenge()}

function prayerSpeak(text){if(!("speechSynthesis" in window)){alert("Vorlesen wird auf diesem Gerät nicht unterstützt.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=.78;u.pitch=1;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase().startsWith("de"));if(v)u.voice=v;speechSynthesis.speak(u)}
function prayerStop(){if("speechSynthesis" in window)speechSynthesis.cancel()}
function prayerHome(){prayerStop();s={mode:"prayer"};let p=progress();app.innerHTML='<section class="hero"><span class="sticker">🙏 Neues Lernabenteuer</span><h2>Das Vaterunser auswendig lernen</h2><p>6 Sinnabschnitte · viele verschiedene Übungen · in deinem Tempo</p><span class="pill">⭐ '+(p.prayer||0)+' Übungen geschafft</span></section><div class="grid">'+[
["📖","Gebet entdecken","Lesen, verstehen und abschnittsweise hören","prayerRead()"],
["🔊","Hören & mitsprechen","Langsam anhören und nachsprechen","prayerListen()"],
["🧠","Wörter verschwinden","Immer mehr Wörter aus dem Gedächtnis ergänzen","prayerHide()"],
["🧩","Gebet sortieren","Die Abschnitte richtig ordnen","prayerSort()"],
["✏️","Lückenfüller","Fehlende Schlüsselwörter finden","prayerCloze()"],
["🔠","Anfangsbuchstaben","Mit kleinen Buchstaben-Hilfen aufsagen","prayerInitials()"],
["🎤","Ohne Hilfe aufsagen","Selbsttest mit verdecktem Gebet","prayerRecall()"],
["🏆","Wissensblitz","Fragen zu Wortlaut und Bedeutung","prayerQuiz()"]
].map(x=>'<button class="tile" onclick="'+x[3]+'"><span class="art">'+x[0]+'</span><strong>'+x[1]+'</strong><span>'+x[2]+'</span></button>').join("")+'</div><p class="muted small">Der abschließende Lobpreis ist enthalten. Die Vorlesefunktion verwendet die Stimme des Geräts.</p>'}
function prayerNav(){return '<div class="actions"><button class="soft" onclick="prayerHome()">← Vaterunser-Menü</button></div>'}
function prayerRead(){s={mode:"pread",n:0};renderPrayerRead()}
function renderPrayerRead(){let g=prayerGroups[s.n];app.innerHTML='<span class="pill">📖 Abschnitt '+(s.n+1)+'/6</span><div class="bar"><div style="width:'+((s.n+1)/6*100)+'%"></div></div><section class="panel"><div class="scene"><span>'+g.icon+'</span></div><h2>'+g.title+'</h2><p class="prayerverse">'+g.lines.map(i=>escapeHTML(prayerLines[i])).join("<br>")+'</p><p class="feedback">💡 '+g.meaning+'</p><div class="actions"><button class="soft" onclick="prayerSpeak(prayerGroups[s.n].lines.map(i=>prayerLines[i]).join(\' \'))">🔊 Anhören</button><button class="soft" onclick="prayerStop()">⏹ Stoppen</button></div></section><div class="actions"><button class="soft" '+(s.n===0?"disabled":"")+' onclick="prayerStop();s.n--;renderPrayerRead()">← Zurück</button><button class="primary" onclick="prayerStop();'+(s.n===5?"prayerWin('Lesen')":"s.n++;renderPrayerRead()")+'">'+(s.n===5?"Fertig ✓":"Weiter →")+'</button></div>'+prayerNav()}
function prayerListen(){app.innerHTML='<section class="panel"><h2>🔊 Hören und nachsprechen</h2><p>Höre erst zu. Sprich dann Satz für Satz mit. Du kannst die Stimme jederzeit stoppen.</p><div class="actions"><button class="primary" onclick="prayerSpeak(prayerText)">▶ Ganzes Vaterunser</button><button class="soft" onclick="prayerStop()">⏹ Stoppen</button></div>'+prayerGroups.map((g,i)=>'<div class="prayerlisten"><span>'+g.icon+' <strong>'+(i+1)+'. '+g.title+'</strong></span><button class="soft" onclick="prayerSpeak(prayerGroups['+i+'].lines.map(i=>prayerLines[i]).join(\' \'))">🔊</button></div>').join("")+'<button class="primary" onclick="prayerStop();prayerWin(\'Hören\')">Ich habe mitgesprochen ✓</button></section>'+prayerNav()}
function prayerHide(){s={mode:"phide",level:1};renderPrayerHide()}
function renderPrayerHide(){let words=0;let rows=prayerLines.map((line,i)=>line.split(" ").map(w=>{words++;return (words*7+i*3)%5<s.level?"<span class='blankword'>••••</span>":escapeHTML(w)}).join(" ")).join("<br>");app.innerHTML='<span class="pill">🧠 Stufe '+s.level+'/5</span><section class="panel"><h2>Wörter verschwinden!</h2><p>Sprich die fehlenden Wörter laut. Mit jeder Stufe verschwinden mehr Wörter.</p><p class="prayerverse">'+rows+'</p><div class="actions"><button class="soft" onclick="prayerSpeak(prayerText)">🔊 Hilfe anhören</button><button class="primary" onclick="'+(s.level===5?"prayerWin('Wörter verschwinden')":"s.level++;renderPrayerHide()")+'">'+(s.level===5?"Geschafft ✓":"Schwerer machen →")+'</button></div></section>'+prayerNav()}
function prayerSort(){s={mode:"psort",pool:shuffle(prayerGroups.map((g,id)=>({id,g}))),chosen:[],error:""};renderPrayerSort()}
function choosePrayerSort(id){if(id!==s.chosen.length){s.error="Fast! Welcher Abschnitt kommt vorher?";renderPrayerSort();return}let x=s.pool.find(x=>x.id===id);s.chosen.push(x);s.pool=s.pool.filter(x=>x.id!==id);s.error="";renderPrayerSort()}
function renderPrayerSort(){if(!s.pool.length){prayerWin("Gebet sortieren");return}app.innerHTML='<span class="pill">🧩 '+s.chosen.length+'/6 Abschnitte</span><h2>Bring das Gebet in die richtige Reihenfolge</h2><div class="prayerorder">'+s.chosen.map(x=>'<div class="prayerlisten">✅ '+escapeHTML(x.g.lines.map(i=>prayerLines[i]).join(" "))+'</div>').join("")+'</div><h3>Was kommt als Nächstes?</h3><div class="choices">'+s.pool.map(x=>'<button class="choice" onclick="choosePrayerSort('+x.id+')">'+escapeHTML(x.g.lines.map(i=>prayerLines[i]).join(" "))+'</button>').join("")+'</div>'+(s.error?'<p class="feedback" role="status">'+s.error+'</p>':"")+prayerNav()}
const prayerBlanks=[
["Vater unser im _____.","Himmel",["Himmel","Garten","Tempel"]],
["geheiligt werde dein _____.","Name",["Name","Haus","Brot"]],
["Dein _____ komme.","Reich",["Reich","Tag","Weg"]],
["Dein _____ geschehe.","Wille",["Wille","Wort","Lied"]],
["Unser tägliches _____ gib uns heute.","Brot",["Brot","Wasser","Licht"]],
["Und vergib uns unsere _____.","Schuld",["Schuld","Angst","Arbeit"]],
["wie auch wir _____ unsern Schuldigern.","vergeben",["vergeben","danken","helfen"]],
["Und führe uns nicht in _____.","Versuchung",["Versuchung","Freude","Frieden"]],
["sondern erlöse uns von dem _____.","Bösen",["Bösen","Regen","Lärm"]],
["Denn dein ist das Reich und die _____.","Kraft",["Kraft","Liebe","Hoffnung"]],
["und die _____ in Ewigkeit.","Herrlichkeit",["Herrlichkeit","Sonne","Wahrheit"]],
["_____.","Amen",["Amen","Danke","Hallo"]]
];
function prayerCloze(){s={mode:"pcloze",n:0,score:0,answered:false};renderPrayerCloze()}
function renderPrayerCloze(){if(s.n===prayerBlanks.length){prayerWin("Lückenfüller",s.score+" von 12 richtig");return}let x=prayerBlanks[s.n];app.innerHTML='<span class="pill">✏️ Lücke '+(s.n+1)+'/12 · '+s.score+' Sterne</span><div class="bar"><div style="width:'+(s.n/12*100)+'%"></div></div><section class="panel"><h2>Welches Wort fehlt?</h2><p class="question">'+escapeHTML(x[0])+'</p><div class="choices">'+x[2].map((w,i)=>'<button class="choice '+(s.answered?(w===x[1]?"good":i===s.selected?"bad":""):"")+'" onclick="answerPrayerCloze('+i+')" '+(s.answered?"disabled":"")+'>'+escapeHTML(w)+'</button>').join("")+'</div>'+(s.answered?'<p class="feedback">Das gesuchte Wort ist <strong>'+x[1]+'</strong>.</p><button class="primary" onclick="s.n++;s.answered=false;renderPrayerCloze()">Weiter →</button>':"")+'</section>'+prayerNav()}
function answerPrayerCloze(i){if(s.answered)return;s.selected=i;s.answered=true;if(prayerBlanks[s.n][2][i]===prayerBlanks[s.n][1])s.score++;renderPrayerCloze()}
function prayerInitials(){s={mode:"pinitial",show:false};renderPrayerInitials()}
function renderPrayerInitials(){let initials=prayerLines.map(l=>l.split(" ").map(w=>escapeHTML(w[0].toUpperCase())+"·").join(" ")).join("<br>");app.innerHTML='<section class="panel"><h2>🔠 Die Anfangsbuchstaben-Hilfe</h2><p>Jeder Buchstabe steht für ein Wort. Kannst du das ganze Gebet damit aufsagen?</p><p class="prayerverse">'+(s.show?prayerLines.map(escapeHTML).join("<br>"):initials)+'</p><div class="actions"><button class="soft" onclick="s.show=!s.show;renderPrayerInitials()">'+(s.show?"Buchstaben zeigen":"Lösung zeigen")+'</button><button class="primary" onclick="prayerWin(\'Anfangsbuchstaben\')">Geschafft ✓</button></div></section>'+prayerNav()}
function prayerRecall(){s={mode:"precall",show:false};renderPrayerRecall()}
function renderPrayerRecall(){app.innerHTML='<section class="panel"><h2>🎤 Die große Aufsag-Challenge</h2><p>Versuche das Vaterunser ohne Hilfe laut aufzusagen. Du kannst die Lösung anschließend selbst überprüfen.</p><div class="scene"><span>🏅</span></div>'+(s.show?'<p class="prayerverse">'+prayerLines.map(escapeHTML).join("<br>")+'</p>':'<p class="flash">Augen zu, tief durchatmen – und los! 🌟</p>')+'<div class="actions"><button class="soft" onclick="s.show=!s.show;renderPrayerRecall()">'+(s.show?"Text verbergen":"Lösung einblenden")+'</button><button class="primary" onclick="prayerWin(\'Aufsagen\')">Ich habe es aufgesagt ✓</button></div><p class="muted small">Die App hört nicht mit. Prüfe selbst oder lass dir von einem Erwachsenen zuhören.</p></section>'+prayerNav()}
const prayerQuestions=[
["Wie beginnt das Vaterunser?",["Vater unser im Himmel","Gott sei mit dir","Herr, segne uns"],0],
["Was soll geheiligt werden?",["Unser Haus","Gottes Name","Unser Brot"],1],
["Was bitten wir für heute?",["Tägliches Brot","Einen neuen Mantel","Ein neues Buch"],0],
["Worum bitten wir bei der Schuld?",["Um Vergebung","Um Geschenke","Um Reichtum"],0],
["Was kommt nach „Dein Reich komme“?",["Dein Wille geschehe","Amen","Unser tägliches Brot"],0],
["Was kommt vor „sondern erlöse uns von dem Bösen“?",["Und führe uns nicht in Versuchung","Vater unser im Himmel","Dein Reich komme"],0],
["Was gehört zum Lobpreis?",["Reich, Kraft und Herrlichkeit","Brot, Mantel und Licht","Himmel, Erde und Meer"],0],
["Womit endet das Gebet?",["Danke","Amen","Halleluja"],1]
];
function prayerQuiz(){s={mode:"pquiz",n:0,score:0,answered:false,list:shuffle(prayerQuestions)};renderPrayerQuiz()}
function renderPrayerQuiz(){if(s.n===s.list.length){prayerWin("Wissensblitz",s.score+" von 8 richtig");return}let x=s.list[s.n];app.innerHTML='<span class="pill">🏆 Frage '+(s.n+1)+'/8 · '+s.score+' Sterne</span><section class="panel"><p class="question">'+escapeHTML(x[0])+'</p><div class="choices">'+x[1].map((w,i)=>'<button class="choice '+(s.answered?(i===x[2]?"good":i===s.selected?"bad":""):"")+'" onclick="answerPrayerQuiz('+i+')" '+(s.answered?"disabled":"")+'>'+escapeHTML(w)+'</button>').join("")+'</div>'+(s.answered?'<p class="feedback">Richtige Antwort: '+escapeHTML(x[1][x[2]])+'</p><button class="primary" onclick="s.n++;s.answered=false;renderPrayerQuiz()">Weiter →</button>':"")+'</section>'+prayerNav()}
function answerPrayerQuiz(i){if(s.answered)return;s.selected=i;s.answered=true;if(i===s.list[s.n][2])s.score++;renderPrayerQuiz()}
function prayerWin(name,score){let p=progress();p.prayer=Math.min(8,(Number(p.prayer)||0)+1);try{localStorage.setItem("reli3-progress",JSON.stringify(p))}catch{}app.innerHTML='<section class="hero"><div class="scene"><span>🌟</span></div><h2>Super gemacht!</h2><p>Du hast „'+escapeHTML(name)+'“ abgeschlossen.</p>'+(score?'<p class="question">'+escapeHTML(score)+'</p>':"")+'<p>Wiederholen macht dich immer sicherer.</p><div class="actions"><button class="primary" onclick="prayerHome()">Weitere Übungen →</button><button class="soft" onclick="home()">Startseite</button></div></section>'}
function startQuiz(){s={mode:"quiz",q:0,score:0,answered:false};renderQuiz()}function renderQuiz(){if(s.q===quiz.length){mark("quiz");app.innerHTML='<section class="hero"><span class="art">🏆</span><h2>Quiz geschafft!</h2><p class="question">'+s.score+' von '+quiz.length+' richtig</p><div class="actions"><button class="primary" onclick="startQuiz()">Nochmal</button><button class="soft" onclick="home()">Startseite</button></div></section>';return}let q=quiz[s.q];app.innerHTML='<span class="pill">Frage '+(s.q+1)+'/15 · ⭐ '+s.score+'</span><div class="bar"><div style="width:'+(s.q/15*100)+'%"></div></div><section class="panel"><p class="question">'+escapeHTML(q[0])+'</p><div class="choices">'+q[1].map((a,i)=>'<button class="choice '+(s.answered?(i===q[2]?"good":i===s.selected?"bad":""):"")+'" onclick="answer('+i+')" '+(s.answered?"disabled":"")+'>'+escapeHTML(a)+'</button>').join("")+'</div>'+(s.answered?'<div class="feedback">'+(s.selected===q[2]?"🌟 Richtig! ":"💡 Noch nicht ganz. ")+escapeHTML(q[3])+'</div><button class="primary" onclick="s.q++;s.answered=false;renderQuiz()">Weiter →</button>':"")+'</section>'}function answer(i){if(s.answered)return;s.selected=i;s.answered=true;if(i===quiz[s.q][2])s.score++;renderQuiz()}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function startMatch(){s={mode:"match",left:shuffle(pairs.map((p,i)=>({id:i,t:p[0]}))),right:shuffle(pairs.map((p,i)=>({id:i,t:p[1]}))),done:[],active:null,error:""};renderMatch()}function chooseMatch(side,id){if(s.done.includes(id))return;if(side==="left")s.active=id;else if(s.active!==null){if(s.active===id){s.done.push(id);s.error="🌟 Richtig zugeordnet!";if(s.done.length===pairs.length)mark("match")}else s.error="Versuche es noch einmal.";s.active=null}renderMatch()}function renderMatch(){let columns=["left","right"].map(side=>'<div>'+s[side].map(x=>'<button class="'+(s.done.includes(x.id)?"done":side==="left"&&s.active===x.id?"active":"")+'" onclick="chooseMatch(&quot;'+side+'&quot;,'+x.id+')" '+(s.done.includes(x.id)?"disabled":"")+'>'+escapeHTML(x.t)+'</button>').join("")+'</div>').join("");app.innerHTML='<span class="pill">🧩 '+s.done.length+'/10 Paare</span><h2>Was gehört zusammen?</h2><p>Tippe links auf einen Begriff und rechts auf die passende Erklärung.</p><div class="match">'+columns+'</div>'+(s.error?'<p class="feedback" role="status">'+s.error+'</p>':"")+(s.done.length===10?'<p class="feedback">🎉 Alle Paare gefunden!</p>':"")+'<div class="actions"><button class="soft" onclick="home()">Startseite</button><button class="primary" onclick="startMatch()">Neu mischen</button></div>'}
function startOrder(){s={mode:"order",sequence:[],pool:shuffle(order.map((t,id)=>({t,id}))),error:""};renderOrder()}function chooseOrder(id){if(id!==s.sequence.length){s.error="Was ist vorher passiert?";renderOrder();return}let x=s.pool.find(x=>x.id===id);s.sequence.push(x);s.pool=s.pool.filter(x=>x.id!==id);s.error="";if(!s.pool.length)mark("order");renderOrder()}function renderOrder(){app.innerHTML='<span class="pill">🔢 '+s.sequence.length+'/7 Schritte</span><h2>Martins Geschichte ordnen</h2><p>Tippe die Ereignisse in der richtigen Reihenfolge an.</p><section class="panel"><h3>Deine Geschichte</h3>'+(s.sequence.length?'<ol>'+s.sequence.map(x=>'<li style="margin:10px 0">'+escapeHTML(x.t)+' ✅</li>').join("")+'</ol>':'<p class="muted">Noch leer</p>')+'</section>'+(s.pool.length?'<h3>Was kommt als Nächstes?</h3><div class="choices">'+s.pool.map(x=>'<button class="choice" onclick="chooseOrder('+x.id+')">'+escapeHTML(x.t)+'</button>').join("")+'</div>':'<div class="feedback">🎉 Alles richtig geordnet!</div>')+(s.error?'<p class="feedback" role="status">'+s.error+'</p>':"")+'<div class="actions"><button class="soft" onclick="home()">Startseite</button><button class="primary" onclick="startOrder()">Neu beginnen</button></div>'}home();
</script></body></html>
