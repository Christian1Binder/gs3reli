<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7355bd"><title>Religion – Lernwelt Klasse 3</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#29233b;background:#faf7ff}*{box-sizing:border-box}body{margin:0}header{background:#7355bd;color:white;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(20px,4vw,30px);margin:0}main{max-width:940px;margin:auto;padding:20px 16px 70px}button{font:inherit;font-weight:700;border:0;border-radius:15px;padding:15px;cursor:pointer;touch-action:manipulation;min-height:52px}button:focus-visible{outline:3px solid orange}.home{background:white;color:#50398c}.primary{background:#7355bd;color:white}.soft{background:#e9e0fa;color:#35265e}.hero{background:#eee5ff;border-radius:24px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.tile,.panel{background:white;border:2px solid #e5dafa;border-radius:22px;padding:20px}.tile{text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:9px;min-height:165px}.tile strong{font-size:22px}.art{font-size:70px;display:block;text-align:center;margin:10px auto}.muted{color:#655f70}.pill{display:inline-block;background:#e9e0fa;padding:8px 12px;border-radius:99px;font-size:14px;font-weight:700}.bar{height:12px;background:#e9e0fa;border-radius:99px;overflow:hidden;margin:16px 0}.bar>div{background:#7355bd;height:100%}.lesson{font-size:20px;line-height:1.65}.lesson h2{font-size:27px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}.choice{background:#eee8fa;color:#302746;border:2px solid transparent}.good{background:#c9f2d4!important;border-color:#267d48!important}.bad{background:#ffdddd!important;border-color:#b34b4b!important}.feedback{background:#eee5ff;padding:17px;border-radius:16px;margin:15px 0;line-height:1.5}.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match button{display:block;width:100%;margin-bottom:9px;min-height:82px;background:#eee5ff;border:3px solid transparent}.match .active{border-color:#7355bd}.match .done{background:#c9f2d4}.question{font-size:25px;font-weight:750}.small{font-size:14px}@media(max-width:520px){.match button{font-size:14px;padding:9px 5px}.tile{min-height:135px}.art{font-size:58px}}</style></head><body><header><h1>🌟 Religions-Lernwelt</h1><button class="home" onclick="home()">🏠 Start</button></header><main id="app"></main><script>
const lessons=[
{id:"martin",name:"Sankt Martin",date:"11. November",icon:"🏇",pages:[
["Martins Kindheit","Martin wurde im Jahr 316 oder 317 in Savaria geboren. Das liegt heute in Ungarn. Sein Vater war Offizier. Martin wurde Soldat, obwohl er das eigentlich nicht wollte.","🏇"],
["Der frierende Bettler","An einem kalten Wintertag sah Martin einen armen Mann. Er fror und hatte Hunger. Die anderen Soldaten halfen ihm nicht.","🥶"],
["Martin teilt seinen Mantel","Martin hatte Mitleid. Er teilte seinen warmen Mantel mit dem Schwert in zwei Hälften und schenkte eine Hälfte dem Bettler.","🧥"],
["Ein besonderer Traum","In der Nacht träumte Martin von Jesus Christus. Jesus gab sich als der Bettler zu erkennen. Später ließ sich Martin taufen und wurde Priester.","🌙"],
["Die Gänse und das Martinsfest","Martin versteckte sich vor der Wahl zum Bischof in einem Gänsestall. Die schnatternden Gänse verrieten ihn. Er wurde Bischof von Tours. Am 11. November erinnern Laternenumzüge an ihn.","🪿"]]},
{id:"luther",name:"Reformationstag",date:"31. Oktober",icon:"📜",pages:[
["Vor über 500 Jahren","Viele Menschen hatten Angst vor Gottes Strafe. Viele konnten nicht lesen und kannten die Bibel nicht selbst.","📖"],
["Ablassbriefe","Manche Menschen kauften Ablassbriefe. Sie hofften, dadurch nach dem Tod weniger Zeit im Fegefeuer verbringen zu müssen.","✉️"],
["Martin Luther","Der Mönch Martin Luther las die Bibel und widersprach dem Handel mit Ablassbriefen.","👨🏻‍🏫"],
["95 Thesen","Am 31. Oktober 1517 veröffentlichte Luther seine 95 Thesen. Der Überlieferung nach schlug er sie an eine Kirchentür.","📜"],
["Gottes Liebe ist ein Geschenk","Luther betonte: Gottes Liebe und Vergebung kann man nicht kaufen. Er übersetzte die Bibel ins Deutsche, damit mehr Menschen sie lesen konnten.","❤️"]]},
{id:"halloween",name:"Halloween",date:"31. Oktober",icon:"🎃",pages:[
["Das Fest Samhain","Schon vor über 2000 Jahren feierten die Kelten das Fest Samhain. Sie glaubten, dass die Seelen Verstorbener in dieser Nacht zurückkehren konnten.","🌌"],
["Feuer und Kostüme","Mit großen Feuern und gruseligen Verkleidungen wollten die Menschen böse Geister vertreiben.","🔥"],
["Die Sage von Jack","In einer irischen Sage trickste Jack den Teufel aus. Nach seinem Tod durfte er weder in den Himmel noch in die Hölle.","👻"],
["Jacks Laterne","Laut Sage bekam Jack eine glühende Kohle. Er legte sie in eine ausgehöhlte Rübe, um damit umherzuwandern.","🏮"],
["Leuchtende Kürbisse","Aus dem Brauch mit der Rübe wurden später die geschnitzten Kürbislaternen. Halloween und Reformationstag sind beide am 31. Oktober.","🎃"]]}];
const quiz=[
["Wann ist Sankt Martin?",["11. November","31. Oktober","24. Dezember"],0,"Der Martinstag ist am 11. November."],
["Was schenkte Martin dem Bettler?",["Sein Pferd","Eine Hälfte seines Mantels","Sein Schwert"],1,"Er teilte den Mantel mit seinem Schwert."],
["Wo wurde Martin geboren?",["Savaria","Tours","Wittenberg"],0,"Savaria liegt heute in Ungarn."],
["Wen erkannte Martin in seinem Traum?",["Jesus Christus","Seinen Vater","Einen König"],0,"Jesus gab sich im Traum als der Bettler zu erkennen."],
["Wo versteckte Martin sich?",["In einem Gänsestall","In einer Kirche","In einem Wald"],0,"Die Gänse verrieten sein Versteck."],
["Was wurde Martin später?",["Bischof von Tours","König","Kaufmann"],0,"Martin wurde Bischof von Tours."],
["Wann ist Reformationstag?",["11. November","31. Oktober","1. Januar"],1,"Reformationstag ist am 31. Oktober."],
["Wie viele Thesen veröffentlichte Luther?",["12","95","200"],1,"Luther veröffentlichte 95 Thesen."],
["Was kritisierte Luther?",["Den Handel mit Ablassbriefen","Das Lesen der Bibel","Das Beten"],0,"Luther lehnte es ab, Gottes Vergebung gegen Geld zu verkaufen."],
["Was ist Gottes Liebe nach Luthers Botschaft?",["Ein Geschenk","Etwas zum Kaufen","Nur für Reiche"],0,"Gottes Liebe ist ein Geschenk."],
["Warum übersetzte Luther die Bibel?",["Damit mehr Menschen sie lesen konnten","Damit sie kürzer wurde","Damit sie geheim blieb"],0,"Die Bibel sollte verständlicher werden."],
["Wie hieß das keltische Fest?",["Samhain","Pfingsten","Ostern"],0,"Samhain war ein Fest der Kelten."],
["Womit wollten die Kelten Geister vertreiben?",["Feuer und Kostüme","Bücher und Glocken","Laternenumzüge"],0,"Feuer und Kostüme sollten böse Geister abwehren."],
["Was legte Jack laut Sage in eine Rübe?",["Eine glühende Kohle","Einen Apfel","Einen Brief"],0,"Die Kohle sollte ihm Licht geben."],
["Welche Feste sind am 31. Oktober?",["Halloween und Reformationstag","Sankt Martin und Weihnachten","Ostern und Halloween"],0,"Beide fallen auf den 31. Oktober."]];
const pairs=[["Martin","teilte seinen Mantel"],["Bettler","fror in der Kälte"],["Gänse","verrieten das Versteck"],["Tours","Stadt des Bischofs Martin"],["11. November","Martinstag"],["Martin Luther","Mönch und Reformator"],["95 Thesen","1517 veröffentlicht"],["Ablassbrief","wurde gegen Geld verkauft"],["Samhain","altes keltisches Fest"],["Jack","Laterne mit glühender Kohle"]];
const order=["Martin wird Soldat.","Martin begegnet dem frierenden Bettler.","Martin teilt seinen Mantel.","Martin träumt von Jesus.","Martin lässt sich taufen und wird Priester.","Die Gänse verraten Martins Versteck.","Martin wird Bischof von Tours."];
let s={};const app=document.getElementById("app");function progress(){try{return JSON.parse(localStorage.getItem("reli3-progress")||"{}")}catch{return {}}}function mark(id){let p=progress();p[id]=true;try{localStorage.setItem("reli3-progress",JSON.stringify(p))}catch{}}function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function home(){s={mode:"home"};let p=progress();app.innerHTML='<section class="hero"><h2>Hallo, Lernprofi! 👋</h2><p>Entdecke drei Feste und übe mit Spielen.</p><span class="pill">⭐ '+Object.keys(p).length+' von 6 Bereichen geschafft</span></section><div class="grid">'+lessons.map((l,i)=>'<button class="tile" onclick="startLesson('+i+')"><span class="art">'+l.icon+'</span><strong>'+l.name+(p[l.id]?" ✅":"")+'</strong><span>'+l.date+' · 5 Lernkarten</span></button>').join("")+'<button class="tile" onclick="startMatch()"><span class="art">🧩</span><strong>Zuordnung '+(p.match?"✅":"")+'</strong><span>10 passende Paare finden</span></button><button class="tile" onclick="startOrder()"><span class="art">🔢</span><strong>Reihenfolge '+(p.order?"✅":"")+'</strong><span>Martins Geschichte ordnen</span></button><button class="tile" onclick="startQuiz()"><span class="art">🏆</span><strong>Quiz '+(p.quiz?"✅":"")+'</strong><span>15 Fragen beantworten</span></button></div><p class="muted small">Keine Anmeldung · Fortschritt nur auf diesem Gerät</p>'}
function startLesson(i){s={mode:"lesson",i,page:0};renderLesson()}function renderLesson(){let l=lessons[s.i],p=l.pages[s.page];app.innerHTML='<span class="pill">'+l.icon+' '+l.name+' · '+(s.page+1)+'/5</span><div class="bar"><div style="width:'+((s.page+1)*20)+'%"></div></div><section class="panel lesson"><span class="art" aria-hidden="true">'+p[2]+'</span><h2>'+p[0]+'</h2><p>'+p[1]+'</p></section><div class="actions"><button class="soft" onclick="s.page--;renderLesson()" '+(s.page===0?"disabled":"")+'>← Zurück</button><button class="primary" onclick="nextLesson()">'+(s.page===4?"Geschafft ✓":"Weiter →")+'</button></div>'}function nextLesson(){if(s.page===4){mark(lessons[s.i].id);home()}else{s.page++;renderLesson()}}
function startQuiz(){s={mode:"quiz",q:0,score:0,answered:false};renderQuiz()}function renderQuiz(){if(s.q===quiz.length){mark("quiz");app.innerHTML='<section class="hero"><span class="art">🏆</span><h2>Quiz geschafft!</h2><p class="question">'+s.score+' von '+quiz.length+' richtig</p><div class="actions"><button class="primary" onclick="startQuiz()">Nochmal</button><button class="soft" onclick="home()">Startseite</button></div></section>';return}let q=quiz[s.q];app.innerHTML='<span class="pill">Frage '+(s.q+1)+'/15 · ⭐ '+s.score+'</span><div class="bar"><div style="width:'+(s.q/15*100)+'%"></div></div><section class="panel"><p class="question">'+escapeHTML(q[0])+'</p><div class="choices">'+q[1].map((a,i)=>'<button class="choice '+(s.answered?(i===q[2]?"good":i===s.selected?"bad":""):"")+'" onclick="answer('+i+')" '+(s.answered?"disabled":"")+'>'+escapeHTML(a)+'</button>').join("")+'</div>'+(s.answered?'<div class="feedback">'+(s.selected===q[2]?"🌟 Richtig! ":"💡 Noch nicht ganz. ")+escapeHTML(q[3])+'</div><button class="primary" onclick="s.q++;s.answered=false;renderQuiz()">Weiter →</button>':"")+'</section>'}function answer(i){if(s.answered)return;s.selected=i;s.answered=true;if(i===quiz[s.q][2])s.score++;renderQuiz()}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function startMatch(){s={mode:"match",left:shuffle(pairs.map((p,i)=>({id:i,t:p[0]}))),right:shuffle(pairs.map((p,i)=>({id:i,t:p[1]}))),done:[],active:null,error:""};renderMatch()}function chooseMatch(side,id){if(s.done.includes(id))return;if(side==="left")s.active=id;else if(s.active!==null){if(s.active===id){s.done.push(id);s.error="🌟 Richtig zugeordnet!";if(s.done.length===pairs.length)mark("match")}else s.error="Versuche es noch einmal.";s.active=null}renderMatch()}function renderMatch(){let columns=["left","right"].map(side=>'<div>'+s[side].map(x=>'<button class="'+(s.done.includes(x.id)?"done":side==="left"&&s.active===x.id?"active":"")+'" onclick="chooseMatch(&quot;'+side+'&quot;,'+x.id+')" '+(s.done.includes(x.id)?"disabled":"")+'>'+escapeHTML(x.t)+'</button>').join("")+'</div>').join("");app.innerHTML='<span class="pill">🧩 '+s.done.length+'/10 Paare</span><h2>Was gehört zusammen?</h2><p>Tippe links auf einen Begriff und rechts auf die passende Erklärung.</p><div class="match">'+columns+'</div>'+(s.error?'<p class="feedback" role="status">'+s.error+'</p>':"")+(s.done.length===10?'<p class="feedback">🎉 Alle Paare gefunden!</p>':"")+'<div class="actions"><button class="soft" onclick="home()">Startseite</button><button class="primary" onclick="startMatch()">Neu mischen</button></div>'}
function startOrder(){s={mode:"order",sequence:[],pool:shuffle(order.map((t,id)=>({t,id}))),error:""};renderOrder()}function chooseOrder(id){if(id!==s.sequence.length){s.error="Was ist vorher passiert?";renderOrder();return}let x=s.pool.find(x=>x.id===id);s.sequence.push(x);s.pool=s.pool.filter(x=>x.id!==id);s.error="";if(!s.pool.length)mark("order");renderOrder()}function renderOrder(){app.innerHTML='<span class="pill">🔢 '+s.sequence.length+'/7 Schritte</span><h2>Martins Geschichte ordnen</h2><p>Tippe die Ereignisse in der richtigen Reihenfolge an.</p><section class="panel"><h3>Deine Geschichte</h3>'+(s.sequence.length?'<ol>'+s.sequence.map(x=>'<li style="margin:10px 0">'+escapeHTML(x.t)+' ✅</li>').join("")+'</ol>':'<p class="muted">Noch leer</p>')+'</section>'+(s.pool.length?'<h3>Was kommt als Nächstes?</h3><div class="choices">'+s.pool.map(x=>'<button class="choice" onclick="chooseOrder('+x.id+')">'+escapeHTML(x.t)+'</button>').join("")+'</div>':'<div class="feedback">🎉 Alles richtig geordnet!</div>')+(s.error?'<p class="feedback" role="status">'+s.error+'</p>':"")+'<div class="actions"><button class="soft" onclick="home()">Startseite</button><button class="primary" onclick="startOrder()">Neu beginnen</button></div>'}home();
</script></body></html>
