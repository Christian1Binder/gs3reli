<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1768a7"><title>Religion – Lernwelt Klasse 3</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#183b54;background:#f4f9fc;--blue:#1768a7;--green:#65a744;--yellow:#f4c844;--pink:#e87c9d;--paper:#fff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#1768a7,#259ab2);color:white;padding:19px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 24px #1768a72b}h1{font-size:clamp(20px,4vw,30px);margin:0}main{max-width:940px;margin:auto;padding:20px 16px 70px}button{font:inherit;font-weight:700;border:0;border-radius:15px;padding:15px;cursor:pointer;touch-action:manipulation;min-height:52px}button:focus-visible{outline:3px solid orange}.home{background:white;color:#50398c}.primary{background:#1768a7;color:white}.soft{background:#e5f2f9;color:#174e78}.hero{background:linear-gradient(125deg,#d9f1f9,#e9f5d9);border-radius:28px;padding:26px;margin-bottom:18px;box-shadow:0 12px 30px #1768a710}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.tile,.panel{background:white;border:2px solid #e3edf2;border-radius:24px;padding:20px;box-shadow:0 8px 22px #183b540b}.tile{text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:9px;min-height:165px}.tile strong{font-size:22px}.art{font-size:70px;display:block;text-align:center;margin:10px auto}.muted{color:#655f70}.pill{display:inline-block;background:#d8edfa;color:#155582;padding:8px 13px;border-radius:99px;font-size:14px;font-weight:800}.bar{height:13px;background:#e0eef3;border-radius:99px;overflow:hidden;margin:16px 0}.bar>div{background:linear-gradient(90deg,#65a744,#f4c844);height:100%;transition:width .3s}.lesson{font-size:20px;line-height:1.65}.lesson h2{font-size:27px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}.choice{background:#eaf4fb;color:#183b54;border:2px solid transparent}.good{background:#c9f2d4!important;border-color:#267d48!important}.bad{background:#ffdddd!important;border-color:#b34b4b!important}.feedback{background:#e7f5e6;padding:17px;border-radius:16px;margin:15px 0;line-height:1.5}.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match button{display:block;width:100%;margin-bottom:9px;min-height:82px;background:#eaf4fb;border:3px solid transparent}.match .active{border-color:#1768a7}.match .done{background:#c9f2d4}.question{font-size:25px;font-weight:750}.small{font-size:14px}@media(max-width:520px){.match button{font-size:14px;padding:9px 5px}.tile{min-height:135px}.art{font-size:58px}}.tile:nth-child(3n+1){border-top:6px solid #1768a7}.tile:nth-child(3n+2){border-top:6px solid #65a744}.tile:nth-child(3n){border-top:6px solid #f4c844}.tile:hover,.choice:hover{transform:translateY(-2px)}button{transition:transform .15s,box-shadow .15s}button:active{transform:scale(.97)}.sticker{display:inline-flex;background:#fff2bc;border:2px solid #f0cc54;padding:7px 13px;border-radius:20px;transform:rotate(-3deg);font-weight:850}.scene{display:flex;align-items:center;justify-content:center;min-height:150px;background:linear-gradient(140deg,#d9eefc,#f1f9d9);border-radius:22px;margin:14px 0}.scene span{font-size:86px;filter:drop-shadow(0 8px 4px #0001)}.mini{color:#49758d;font-weight:700}.truefalse{display:grid;grid-template-columns:1fr 1fr;gap:12px}.flash{background:#fff6d8;border:2px solid #f4c844;padding:20px;border-radius:20px}.mission{font-size:21px;font-weight:800}@media(prefers-reduced-motion:reduce){*{transition:none!important}} .storygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.storycard{min-height:190px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;border:2px solid #d6e8ee;box-shadow:0 5px 15px #183b5410}.storypic{font-size:65px;line-height:1.4}.storydone{display:flex;align-items:center;gap:16px;border-radius:20px;padding:13px;margin-bottom:12px}.storydone .storypic{font-size:50px}.storydone p{margin:6px 0;line-height:1.45}@media(max-width:480px){.storygrid{grid-template-columns:repeat(2,minmax(0,1fr))}.storycard{min-height:160px}.storypic{font-size:54px}}</style></head><body><header><h1>🌟 Religions-Lernwelt</h1><button class="home" onclick="home()">🏠 Start</button></header><main id="app"></main><script>

["Martin Luther","Der Mönch Martin Luther las die Bibel und widersprach dem Handel mit Ablassbriefen.","👨🏻‍🏫"],

["Gottes Liebe ist ein Geschenk","Luther betonte: Gottes Liebe und Vergebung kann man nicht kaufen. Er übersetzte die Bibel ins Deutsche, damit mehr Menschen sie lesen konnten.","❤️"]]},
{id:"halloween",name:"Halloween",date:"31. Oktober",icon:"🎃",pages:[
["Das Fest Samhain","Schon vor über 2000 Jahren feierten die Kelten das Fest Samhain. Sie glaubten, dass die Seelen Verstorbener in dieser Nacht zurückkehren konnten.","🌌"],
["Feuer und Kostüme","Mit großen Feuern und gruseligen Verkleidungen wollten die Menschen böse Geister vertreiben.","🔥"],

["Leuchtende Kürbisse","Aus dem Brauch mit der Rübe wurden später die geschnitzten Kürbislaternen. Halloween und Reformationstag sind beide am 31. Oktober.","🎃"]]}];
const quiz=[
["Wann ist Sankt Martin?",["11. November","31. Oktober","24. Dezember"],0,"Der Martinstag ist am 11. November."],
["Was schenkte Martin dem Bettler?",["Sein Pferd","Eine Hälfte seines Mantels","Sein Schwert"],1,"Er teilte den Mantel mit seinem Schwert."],
["Wo wurde Martin geboren?",["Savaria","Tours","Wittenberg"],0,"Savaria liegt heute in Ungarn."],
["Wen erkannte Martin in seinem Traum?",["Jesus Christus","Seinen Vater","Einen König"],0,"Jesus gab sich im Traum als der Bettler zu erkennen."],

["Wann ist Reformationstag?",["11. November","31. Oktober","1. Januar"],1,"Reformationstag ist am 31. Oktober."],

["Was ist Gottes Liebe nach Luthers Botschaft?",["Ein Geschenk","Etwas zum Kaufen","Nur für Reiche"],0,"Gottes Liebe ist ein Geschenk."],

let s={};const app=document.getElementById("app");function progress(){try{return JSON.parse(localStorage.getItem("reli3-progress")||"{}")}catch{return {}}}function mark(id){let p=progress();p[id]=true;try{localStorage.setItem("reli3-progress",JSON.stringify(p))}catch{}}function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function home(){s={mode:"home"};let p=progress();app.innerHTML='<section class="hero"><h2>Hallo, Lernprofi! 👋</h2><p>Entdecke drei Feste und übe mit Spielen.</p><span class="pill">⭐ '+Object.keys(p).length+' von 9 Bereichen geschafft</span></section><div class="grid">'+lessons.map((l,i)=>'<button class="tile" onclick="startLesson('+i+')"><span class="art">'+l.icon+'</span><strong>'+l.name+(p[l.id]?" ✅":"")+'</strong><span>'+l.date+' · 5 Lernkarten</span></button>').join("")+'<button class="tile" onclick="startMatch()"><span class="art">🧩</span><strong>Zuordnung '+(p.match?"✅":"")+'</strong><span>10 passende Paare finden</span></button><button class="tile" onclick="startOrder()"><span class="art">🔢</span><strong>Reihenfolge '+(p.order?"✅":"")+'</strong><span>Martins Geschichte ordnen</span></button><button class="tile" onclick="startStory()"><span class="art">🖼️</span><strong>Martins Bildergeschichte '+(p.story?"✅":"")+'</strong><span>6 Szenen in die richtige Reihenfolge bringen</span></button><button class="tile" onclick="startChallenge()"><span class="art">🎯</span><strong>Wahr oder Quatsch? '+(p.challenge?"✅":"")+'</strong><span>8 Aussagen beurteilen</span></button><button class="tile" onclick="startMystery()"><span class="art">🕵️</span><strong>Wer bin ich? '+(p.mystery?"✅":"")+'</strong><span>5 spannende Rätsel lösen</span></button><button class="tile" onclick="startQuiz()"><span class="art">🏆</span><strong>Quiz '+(p.quiz?"✅":"")+'</strong><span>15 Fragen beantworten</span></button></div><p class="muted small">Keine Anmeldung · Fortschritt nur auf diesem Gerät</p>'}
function startLesson(i){s={mode:"lesson",i,page:0};renderLesson()}function renderLesson(){let l=lessons[s.i],p=l.pages[s.page];app.innerHTML='<span class="pill">'+l.icon+' '+l.name+' · '+(s.page+1)+'/5</span><div class="bar"><div style="width:'+((s.page+1)*20)+'%"></div></div><section class="panel lesson"><div class="scene"><span aria-hidden="true">'+p[2]+'</span></div><h2>'+p[0]+'</h2><p>'+p[1]+'</p></section><div class="actions"><button class="soft" onclick="s.page--;renderLesson()" '+(s.page===0?"disabled":"")+'>← Zurück</button><button class="primary" onclick="nextLesson()">'+(s.page===4?"Geschafft ✓":"Weiter →")+'</button></div>'}function nextLesson(){if(s.page===4){mark(lessons[s.i].id);home()}else{s.page++;renderLesson()}}

const claims=[
["Martin schenkte dem Bettler die Hälfte seines Mantels.",true,"Martin teilte seinen Mantel mit dem Schwert."],
["Der Martinstag ist am 31. Oktober.",false,"Sankt Martin feiern wir am 11. November."],
["Die Gänse verrieten Martins Versteck.",true,"Die schnatternden Gänse machten ihn bemerkbar."],
["Martin wurde später Bischof von Tours.",true,"Tours liegt in Frankreich."],
["Luther veröffentlichte 1517 seine 95 Thesen.",true,"Das geschah am 31. Oktober 1517."],
["Luther meinte, Gottes Liebe könne man kaufen.",false,"Gottes Liebe und Vergebung sind ein Geschenk."],
["Luther übersetzte die Bibel ins Deutsche.",true,"So konnten mehr Menschen die Bibel verstehen."],
["Samhain war ein altes keltisches Fest.",true,"Halloween hat unter anderem Wurzeln in Samhain."],
["Jack legte laut Sage eine Kerze in einen Apfel.",false,"In der Sage legte Jack eine glühende Kohle in eine Rübe."],
["Halloween und Reformationstag fallen auf denselben Tag.",true,"Beide sind am 31. Oktober."],
["Martin begegnete einem frierenden Bettler.",true,"Der Mann hatte Hunger und fror."],
["Martin versteckte sich vor seiner Wahl in einem Pferdestall.",false,"Laut Überlieferung versteckte er sich in einem Gänsestall."]
];
function startChallenge(){s={mode:"challenge",list:shuffle(claims).slice(0,8),n:0,score:0,answered:false};renderChallenge()}
function renderChallenge(){if(s.n===s.list.length){mark("challenge");app.innerHTML='<section class="hero"><span class="art">🎉</span><h2>Blitzrunde geschafft!</h2><p class="question">'+s.score+' von 8 richtig</p><button class="primary" onclick="home()">Zur Lernwelt</button></section>';return}let x=s.list[s.n];app.innerHTML='<span class="pill">⚡ Blitzrunde '+(s.n+1)+'/8 · '+s.score+' Sterne</span><div class="bar"><div style="width:'+(s.n/8*100)+'%"></div></div><section class="panel"><span class="sticker">Wahr oder Quatsch?</span><p class="question">'+escapeHTML(x[0])+'</p><div class="truefalse"><button class="choice" onclick="judge(true)" '+(s.answered?"disabled":"")+'>👍 Stimmt!</button><button class="choice" onclick="judge(false)" '+(s.answered?"disabled":"")+'>🤔 Quatsch!</button></div>'+(s.answered?'<div class="feedback">'+(s.ok?"🌟 Genau! ":"💡 Fast! ")+escapeHTML(x[2])+'</div><button class="primary" onclick="s.n++;s.answered=false;renderChallenge()">Weiter →</button>':"")+'</section>'}
function judge(v){if(s.answered)return;s.answered=true;s.ok=v===s.list[s.n][1];if(s.ok)s.score++;renderChallenge()}
const mysteries=[
{clue:["Ich war Soldat.","Ich sah einen frierenden Bettler.","Ich teilte meinen Mantel."],answers:["Sankt Martin","Martin Luther","Jack"],correct:0},
{clue:["Ich war Mönch.","Ich schrieb 95 Thesen.","Ich übersetzte die Bibel ins Deutsche."],answers:["Jack","Martin Luther","Sankt Martin"],correct:1},
{clue:["Ich komme in einer irischen Sage vor.","Ich trickste den Teufel aus.","Ich trug eine glühende Kohle in einer Rübe."],answers:["Jack","Martin Luther","Der Bettler"],correct:0},
{clue:["Wir schnattern laut.","Wir verrieten ein Versteck.","Martin versteckte sich bei uns."],answers:["Pferde","Gänse","Schafe"],correct:1},
{clue:["Ich war arm.","Mir war sehr kalt.","Martin schenkte mir einen halben Mantel."],answers:["Ein Bischof","Ein Soldat","Der Bettler"],correct:2}
];
function startMystery(){s={mode:"mystery",list:shuffle(mysteries),n:0,hint:1,score:0,answered:false};renderMystery()}
function renderMystery(){if(s.n===s.list.length){mark("mystery");app.innerHTML='<section class="hero"><span class="art">🕵️</span><h2>Rätsel gelöst!</h2><p class="question">'+s.score+' von 5 erkannt</p><button class="primary" onclick="home()">Zur Lernwelt</button></section>';return}let x=s.list[s.n];app.innerHTML='<span class="pill">🕵️ Rätsel '+(s.n+1)+'/5</span><section class="panel"><span class="sticker">Wer bin ich?</span><div class="flash">'+x.clue.slice(0,s.hint).map(t=>'<p class="mission">🔎 '+escapeHTML(t)+'</p>').join("")+'</div>'+(s.hint<3&&!s.answered?'<div class="actions"><button class="soft" onclick="s.hint++;renderMystery()">Noch ein Hinweis 💡</button></div>':"")+'<div class="choices">'+x.answers.map((a,i)=>'<button class="choice '+(s.answered&&i===x.correct?"good":"")+'" onclick="solveMystery('+i+')" '+(s.answered?"disabled":"")+'>'+escapeHTML(a)+'</button>').join("")+'</div>'+(s.answered?'<div class="feedback">'+(s.ok?"🌟 Super erkannt!":"💡 Das war "+escapeHTML(x.answers[x.correct])+".")+'</div><button class="primary" onclick="s.n++;s.hint=1;s.answered=false;renderMystery()">Nächstes Rätsel →</button>':"")+'</section>'}
function solveMystery(i){if(s.answered)return;s.answered=true;s.ok=i===s.list[s.n].correct;if(s.ok)s.score++;renderMystery()}

const storyScenes=[
{icon:"🏇",title:"Martin ist Soldat",desc:"Martin ist Soldat und reitet an einem kalten Tag durch die Stadt.",bg:"#dbeefa"},
{icon:"🥶",title:"Ein Mann friert",desc:"Martin sieht einen armen Bettler, der friert und um Hilfe bittet.",bg:"#dff0fc"},
{icon:"🧥",title:"Der Mantel wird geteilt",desc:"Martin teilt seinen warmen Mantel mit dem Schwert in zwei Hälften.",bg:"#fff0cf"},
{icon:"🤝",title:"Martin hilft",desc:"Eine Hälfte des Mantels schenkt er dem frierenden Mann.",bg:"#e5f5d9"},

{icon:"🪿",title:"Die Gänse",desc:"Später verraten schnatternde Gänse Martins Versteck. Er wird Bischof von Tours.",bg:"#fff1d8"}

function startStory(){s={mode:"story",pool:shuffle(storyScenes.map((x,id)=>({...x,id}))),chosen:[],error:""};renderStory()}
function chooseStory(id){if(id!==s.chosen.length){s.error="Schau noch einmal: Was geschah vorher?";renderStory();return}let x=s.pool.find(x=>x.id===id);s.chosen.push(x);s.pool=s.pool.filter(x=>x.id!==id);s.error="";if(!s.pool.length)mark("story");renderStory()}
function renderStory(){let cards=s.pool.map(x=>'<button class="storycard" onclick="chooseStory('+x.id+')" style="background:'+x.bg+'"><span class="storypic" aria-hidden="true">'+x.icon+'</span><strong>'+escapeHTML(x.title)+'</strong></button>').join("");let done=s.chosen.map((x,i)=>'<article class="storydone" style="background:'+x.bg+'"><span class="storypic" aria-hidden="true">'+x.icon+'</span><div><strong>'+(i+1)+'. '+escapeHTML(x.title)+'</strong><p>'+escapeHTML(x.desc)+'</p></div></article>').join("");app.innerHTML='<span class="pill">🖼️ Bildergeschichte · '+s.chosen.length+'/6</span><h2>Wie war das noch mit Sankt Martin?</h2><p>Tippe die Bildkarten in der richtigen Reihenfolge an. Jede Karte erzählt ein Stück der Geschichte.</p>'+(s.chosen.length?'<h3>Deine Geschichte</h3><div class="storyline">'+done+'</div>':"")+(s.pool.length?'<h3>Welche Szene kommt als Nächstes?</h3><div class="storygrid">'+cards+'</div>':'<div class="feedback">🎉 Geschafft! Du hast die Geschichte richtig erzählt.</div>')+(s.error?'<p class="feedback" role="status">'+s.error+'</p>':"")+'<div class="actions"><button class="soft" onclick="home()">Startseite</button><button class="primary" onclick="startStory()">Neu mischen</button></div>'}
function startQuiz(){s={mode:"quiz",q:0,score:0,answered:false};renderQuiz()}function renderQuiz(){if(s.q===quiz.length){mark("quiz");app.innerHTML='<section class="hero"><span class="art">🏆</span><h2>Quiz geschafft!</h2><p class="question">'+s.score+' von '+quiz.length+' richtig</p><div class="actions"><button class="primary" onclick="startQuiz()">Nochmal</button><button class="soft" onclick="home()">Startseite</button></div></section>';return}let q=quiz[s.q];app.innerHTML='<span class="pill">Frage '+(s.q+1)+'/15 · ⭐ '+s.score+'</span><div class="bar"><div style="width:'+(s.q/15*100)+'%"></div></div><section class="panel"><p class="question">'+escapeHTML(q[0])+'</p><div class="choices">'+q[1].map((a,i)=>'<button class="choice '+(s.answered?(i===q[2]?"good":i===s.selected?"bad":""):"")+'" onclick="answer('+i+')" '+(s.answered?"disabled":"")+'>'+escapeHTML(a)+'</button>').join("")+'</div>'+(s.answered?'<div class="feedback">'+(s.selected===q[2]?"🌟 Richtig! ":"💡 Noch nicht ganz. ")+escapeHTML(q[3])+'</div><button class="primary" onclick="s.q++;s.answered=false;renderQuiz()">Weiter →</button>':"")+'</section>'}function answer(i){if(s.answered)return;s.selected=i;s.answered=true;if(i===quiz[s.q][2])s.score++;renderQuiz()}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function startMatch(){s={mode:"match",left:shuffle(pairs.map((p,i)=>({id:i,t:p[0]}))),right:shuffle(pairs.map((p,i)=>({id:i,t:p[1]}))),done:[],active:null,error:""};renderMatch()}function chooseMatch(side,id){if(s.done.includes(id))return;if(side==="left")s.active=id;else if(s.active!==null){if(s.active===id){s.done.push(id);s.error="🌟 Richtig zugeordnet!";if(s.done.length===pairs.length)mark("match")}else s.error="Versuche es noch einmal.";s.active=null}renderMatch()}function renderMatch(){let columns=["left","right"].map(side=>'<div>'+s[side].map(x=>'<button class="'+(s.done.includes(x.id)?"done":side==="left"&&s.active===x.id?"active":"")+'" onclick="chooseMatch(&quot;'+side+'&quot;,'+x.id+')" '+(s.done.includes(x.id)?"disabled":"")+'>'+escapeHTML(x.t)+'</button>').join("")+'</div>').join("");app.innerHTML='<span class="pill">🧩 '+s.done.length+'/10 Paare</span><h2>Was gehört zusammen?</h2><p>Tippe links auf einen Begriff und rechts auf die passende Erklärung.</p><div class="match">'+columns+'</div>'+(s.error?'<p class="feedback" role="status">'+s.error+'</p>':"")+(s.done.length===10?'<p class="feedback">🎉 Alle Paare gefunden!</p>':"")+'<div class="actions"><button class="soft" onclick="home()">Startseite</button><button class="primary" onclick="startMatch()">Neu mischen</button></div>'}
function startOrder(){s={mode:"order",sequence:[],pool:shuffle(order.map((t,id)=>({t,id}))),error:""};renderOrder()}function chooseOrder(id){if(id!==s.sequence.length){s.error="Was ist vorher passiert?";renderOrder();return}let x=s.pool.find(x=>x.id===id);s.sequence.push(x);s.pool=s.pool.filter(x=>x.id!==id);s.error="";if(!s.pool.length)mark("order");renderOrder()}function renderOrder(){app.innerHTML='<span class="pill">🔢 '+s.sequence.length+'/7 Schritte</span><h2>Martins Geschichte ordnen</h2><p>Tippe die Ereignisse in der richtigen Reihenfolge an.</p><section class="panel"><h3>Deine Geschichte</h3>'+(s.sequence.length?'<ol>'+s.sequence.map(x=>'<li style="margin:10px 0">'+escapeHTML(x.t)+' ✅</li>').join("")+'</ol>':'<p class="muted">Noch leer</p>')+'</section>'+(s.pool.length?'<h3>Was kommt als Nächstes?</h3><div class="choices">'+s.pool.map(x=>'<button class="choice" onclick="chooseOrder('+x.id+')">'+escapeHTML(x.t)+'</button>').join("")+'</div>':'<div class="feedback">🎉 Alles richtig geordnet!</div>')+(s.error?'<p class="feedback" role="status">'+s.error+'</p>':"")+'<div class="actions"><button class="soft" onclick="home()">Startseite</button><button class="primary" onclick="startOrder()">Neu beginnen</button></div>'}home();
</script></body></html>
